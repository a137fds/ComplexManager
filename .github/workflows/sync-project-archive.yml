name: Sync project archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract complete project archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync-extracted
          mkdir .sync-extracted
          unzip -q complexmanager.zip -d .sync-extracted

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.sync-extracted' \
            -exec rm -rf {} +

          cp -a .sync-extracted/. .
          rm -rf .sync-extracted

          rm -f complexmanager.zip
          rm -f .github/workflows/sync-project-archive.yml

      - name: Commit synchronized project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: restore complete project from archive"
          git push
