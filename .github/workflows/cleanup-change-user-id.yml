name: Cleanup client ChangeUserID fields

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove ChangeUserID from client forms and write APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/BuildingsView.tsx')
          s = p.read_text()
          s = s.replace("onCreateBuilding: (data: { ComplexID: number; BuildingName: string; ChangeUserID?: string })", "onCreateBuilding: (data: { ComplexID: number; BuildingName: string })")
          s = s.replace("onUpdateBuilding: (id: number, data: { ComplexID: number; BuildingName: string; ChangeUserID?: string })", "onUpdateBuilding: (id: number, data: { ComplexID: number; BuildingName: string })")
          s = re.sub(r"\n\s*ChangeUserID: currentRole \|\| 'admin_user',", "", s)
          s = re.sub(r"\n\s*ChangeUserID: '',", "", s)
          s = re.sub(r"\n\s*ChangeUserID: currentRole \|\| building\.ChangeUserID \|\| 'admin_user',", "", s)
          s = re.sub(r"\n\s*ChangeUserID: addForm\.ChangeUserID \|\| currentRole \|\| 'admin_user',", "", s)
          s = re.sub(r"\n\s*ChangeUserID: editForm\.ChangeUserID \|\| currentRole \|\| 'admin_user',", "", s)
          s = re.sub(r"\n\s*<div>\s*<label className=\"block text-xs font-semibold text-slate-700 mb-1\">\s*Change User ID.*?</div>", "", s, flags=re.S)
          p.write_text(s)

          p = Path('src/components/CloudSqlCrudView.tsx')
          s = p.read_text()
          s = re.sub(r"\n\s*changeUserId: '',", "", s)
          s = re.sub(r"\n\s*changeUserId: currentUser\?\.email \|\| currentUser\?\.uid \|\| 'admin_user',", "", s)
          s = re.sub(r"\n\s*changeUserId: currentUser\?\.email \|\| currentUser\?\.uid \|\| item\.changeUserId \|\| 'admin_user',", "", s)
          s = re.sub(r"\n\s*changeUserId: complexForm\.changeUserId,", "", s)
          s = re.sub(r"\n\s*changeUserId: buildingForm\.changeUserId,", "", s)
          s = re.sub(r"\n\s*<div>\s*<label[^>]*>\s*Change User ID.*?</div>", "", s, flags=re.S)
          p.write_text(s)

          p = Path('src/api/databaseApi.ts')
          s = p.read_text()
          s = re.sub(r"; ChangeUserID\?: string; changeUserId\?: string", "", s)
          s = re.sub(r", ChangeUserID: data\.ChangeUserID \|\| data\.changeUserId", "", s)
          s = re.sub(r", ChangeUserID: data\.ChangeUserID \?\? data\.changeUserId", "", s)
          p.write_text(s)

          Path('.github/workflows/cleanup-change-user-id.yml').unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BuildingsView.tsx src/components/CloudSqlCrudView.tsx src/api/databaseApi.ts .github/workflows/cleanup-change-user-id.yml
          git commit -m "Remove ChangeUserID from client forms"
          git push
